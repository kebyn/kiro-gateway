# Dependency policy used by cargo-deny. Keep this list explicit so a newly
# introduced license or registry requires a deliberate review.

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
# These versions are pulled by independently maintained transitive stacks
# (ring/rustls, rusqlite, and the current HTTP/proc-macro ecosystem). They are
# pinned in Cargo.lock and cannot be unified without replacing an upstream
# dependency; every other duplicate is rejected.
skip = [
    { name = "getrandom", version = "0.2.17" },
    { name = "getrandom", version = "0.3.4" },
    { name = "getrandom", version = "0.4.3" },
    { name = "hashbrown", version = "0.14.5" },
    { name = "hashbrown", version = "0.17.1" },
    { name = "r-efi", version = "5.3.0" },
    { name = "r-efi", version = "6.0.0" },
    { name = "syn", version = "2.0.119" },
    { name = "syn", version = "3.0.6" },
    { name = "windows-sys", version = "0.52.0" },
    { name = "windows-sys", version = "0.61.2" },
]
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
