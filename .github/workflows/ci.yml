name: ci
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: admin-ui/pnpm-lock.yaml
      - run: corepack enable
      - run: pnpm --dir admin-ui install --frozen-lockfile
      - run: node --check admin-ui/src/build.mjs
      - run: pnpm --dir admin-ui build
      - run: test -s admin-ui/dist/index.html
      - run: git diff --exit-code -- admin-ui/dist/index.html

  rust:
    runs-on: ubuntu-24.04
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.1
          components: rustfmt,clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check admin-ui/src/build.mjs
      - run: node admin-ui/src/build.mjs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo package --locked --allow-dirty
      - run: SOURCE_DATE_EPOCH=0 ./scripts/verify-reproducible.sh

  docker:
    runs-on: ubuntu-24.04
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag kiro-gateway-rs:ci .
