name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: admin-ui/pnpm-lock.yaml
      - run: corepack pnpm@9.15.4 --dir admin-ui install --frozen-lockfile
      - run: node --check admin-ui/src/build.mjs
      - run: corepack pnpm@9.15.4 --dir admin-ui build
      - run: test -s admin-ui/dist/index.html
      - run: test -s admin-ui/dist/app.js
      - run: test -s admin-ui/dist/styles.css
      - run: git diff --exit-code -- admin-ui/dist

  rust:
    runs-on: ubuntu-24.04
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.85.1
          components: rustfmt,clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check admin-ui/src/build.mjs
      - run: node admin-ui/src/build.mjs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo package --locked --allow-dirty
      - run: SOURCE_DATE_EPOCH=0 ./scripts/verify-reproducible.sh

  docker:
    runs-on: ubuntu-24.04
    needs: [frontend, rust]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=ci,enable=${{ github.event_name != 'push' || (github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/')) }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
