<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiro Gateway Admin</title>
<style>body{font:16px system-ui;margin:2rem;max-width:60rem}main{display:grid;gap:1rem}form{display:flex;gap:.5rem}input,button{padding:.55rem}pre{background:#f5f5f5;padding:1rem;overflow:auto;white-space:pre-wrap}.error{color:#b00020}</style></head>
<body><main><h1>Kiro Gateway Admin</h1><form id="login"><input id="key" type="password" autocomplete="current-password" placeholder="Admin API key" required><button>Sign in</button></form><p id="status">Signed out</p><p id="error" class="error" role="alert"></p><section id="panel" hidden><button id="refresh">Refresh credential</button> <button id="logout">Sign out</button><pre id="credential"></pre></section></main>
<script type="module">
let csrfToken = '';
const loginForm = document.querySelector('#login');
const key = document.querySelector('#key');
const status = document.querySelector('#status');
const error = document.querySelector('#error');
const panel = document.querySelector('#panel');
const output = document.querySelector('#credential');
const showError = (message = '') => { error.textContent = message; };
const request = async (path, options = {}) => {
  const headers = new Headers(options.headers || {});
  if (options.method && !['GET', 'HEAD', 'OPTIONS'].includes(options.method.toUpperCase())) headers.set('x-csrf-token', csrfToken);
  const response = await fetch(path, {...options, headers, credentials: 'same-origin'});
  if (!response.ok) throw new Error((await response.text()) || response.statusText);
  return response;
};
const loadCredential = async () => {
  const response = await request('/admin/credential');
  output.textContent = JSON.stringify(await response.json(), null, 2);
};
const loadSession = async () => {
  try {
    const response = await request('/admin/auth/session');
    const value = await response.json();
    csrfToken = value.csrf_token || '';
    status.textContent = 'Signed in';
    panel.hidden = false;
    loginForm.hidden = true;
    showError();
    await loadCredential();
    return true;
  } catch {
    csrfToken = '';
    status.textContent = 'Signed out';
    panel.hidden = true;
    loginForm.hidden = false;
    return false;
  }
};
loginForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  showError();
  try {
    await request('/admin/auth/login', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({api_key: key.value})});
    key.value = '';
    await loadSession();
  } catch (cause) { showError(cause.message); }
});
document.querySelector('#refresh').addEventListener('click', async () => { try { await request('/admin/credential/refresh', {method: 'POST'}); await loadCredential(); } catch (cause) { showError(cause.message); } });
document.querySelector('#logout').addEventListener('click', async () => { try { await request('/admin/auth/logout', {method: 'POST'}); await loadSession(); } catch (cause) { showError(cause.message); } });
loadSession();
</script></body></html>
