[package]
name = "kiro-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A single-tenant Kiro gateway with Anthropic, OpenAI Chat and Responses APIs"
repository = "https://github.com/kebyn/kiro-gateway"
homepage = "https://github.com/kebyn/kiro-gateway"
documentation = "https://github.com/kebyn/kiro-gateway#readme"
build = "build.rs"

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-tls-webpki-roots"]
# Kept as a compatibility feature; the default transport remains rustls so
# reproducible builds do not depend on a host OpenSSL installation.
native-tls = []

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crc = "3.3"
futures-core = "0.3"
futures-util = "0.3"
http = "1.3"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["http1", "http2", "client"] }
mime_guess = "2.0"
parking_lot = "0.12"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "charset"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5.4"
uuid = { version = "1.12", features = ["v4", "v7", "serde"] }

[dev-dependencies]
tempfile = "3.15"
tower = { version = "0.5", features = ["util"] }
